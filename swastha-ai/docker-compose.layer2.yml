  #     KAFKA_LOG_RETENTION_BYTES: 10737418240
  #     KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  #     KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  #     KAFKA_LOG_DIRS: /var/lib/kafka/data
  #     KAFKA_HEAP_OPTS: "-Xms1g -Xmx2g"
  #   volumes:
  #     - kafka-3-data:/var/lib/kafka/data
  #   healthcheck:
  #     test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka-3:9092", "--list"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 60s

  # ── Confluent Schema Registry ─────────────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: swastha-schema-registry
    hostname: schema-registry
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      kafka-1:
        condition: service_healthy
    networks:
      - swastha-net
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka-1:9092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      # BACKWARD compatibility — new schemas must be able to read old messages
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: "_schemas"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Kafka UI (development tool — disable in prod via ENABLE_KAFKA_UI) ─────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: swastha-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    depends_on:
      kafka-1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
      - swastha-net
    environment:
      KAFKA_CLUSTERS_0_NAME: swastha-ai-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_METRICS_PORT: 9999
      # Auth: set DYNAMIC_CONFIG_ENABLED to false in production
      DYNAMIC_CONFIG_ENABLED: "true"
      AUTH_TYPE: "LOGIN_FORM"
      SPRING_SECURITY_USER_NAME: "${KAFKA_UI_USER:-admin}"
      SPRING_SECURITY_USER_PASSWORD: "${KAFKA_UI_PASSWORD:-changeme}"
    profiles:
      - dev  # Only starts with: docker compose --profile dev up

  # ── Topic + Schema Init Container (runs on every stack start) ────────────
  kafka-init:
    image: python:3.11-slim
    container_name: swastha-kafka-init
    restart: "no"
    depends_on:
      kafka-1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
      - swastha-net
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - ./kafka:/kafka
      - ./requirements.txt:/requirements.txt:ro
    command: >
      bash -c "
        pip install kafka-python requests --quiet &&
        python /kafka/setup/create_topics.py &&
        python /kafka/setup/create_schemas.py &&
        python /kafka/setup/verify_setup.py &&
        echo 'Kafka init complete'
      "

  # ── Message Bus Admin API ─────────────────────────────────────────────────
  messagebus-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swastha-messagebus-api
    restart: unless-stopped
    ports:
      - "8003:8003"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - swastha-net
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      ENABLE_PREPROCESSOR: "false"  # Layer 2 service does not run the preprocessor
    command: ["uvicorn", "app.messagebus.health:app", "--host", "0.0.0.0", "--port", "8003"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: swastha-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - swastha-net
    volumes:
      - ./prometheus_alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-admin-api"

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.3
    container_name: swastha-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - swastha-net
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-changeme}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana_dashboard.json:/var/lib/grafana/dashboards/swastha.json:ro

networks:
  swastha-net:
    external: true

volumes:
  kafka-1-data:
  # kafka-2-data:  # Uncomment for prod 3-node cluster
  # kafka-3-data:
  prometheus-data:
  grafana-data:
