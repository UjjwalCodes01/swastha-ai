# ─────────────────────────────────────────────────────────────────────────────
# SwasthaAI — Layer 2: Message Bus
#
# Stack: Kafka 3.6 KRaft (no Zookeeper), Confluent Schema Registry, Kafka-UI
# Prometheus + Grafana monitoring (shared with Layer 0 network)
#
# HOW TO START:
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.layer1.yml \
#                  -f docker-compose.layer2.yml up -d
#
# PRODUCTION UPGRADE (3-node cluster):
#   Uncomment kafka-2 and kafka-3 service blocks below.
#   Change KAFKA_DEFAULT_REPLICATION_FACTOR to 3
#   and KAFKA_MIN_INSYNC_REPLICAS to 2 on all three brokers.
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

# ── Shared cluster ID (must be the same across all brokers) ──────────────────
# Generate once: kafka-storage.sh random-uuid
# Then paste here and in every broker's KAFKA_CLUSTER_ID
x-kafka-cluster-id: &kafka-cluster-id "MkU3OEVBNTcwNTJENDM2Qg"

# ── Common Kafka KRaft environment block (shared across all brokers) ─────────
x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.6.0
  restart: unless-stopped
  networks:
    - swastha-net
  volumes:
    - ./kafka/config/broker.properties:/etc/kafka/kraft/broker.properties:ro

services:

  # ── Kafka Broker / Controller — Node 1 (always active) ────────────────────
  kafka-1:
    <<: *kafka-common
    container_name: swastha-kafka-1
    hostname: kafka-1
    ports:
      - "29092:29092"   # External host access
      - "9092:9092"     # Internal Docker network
      - "9093:9093"     # KRaft controller
    environment:
      # KRaft identity
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CLUSTER_ID: *kafka-cluster-id

      # Listeners
      KAFKA_LISTENERS: >-
        PLAINTEXT://0.0.0.0:9092,
        CONTROLLER://0.0.0.0:9093,
        PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka-1:9092,
        PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        PLAINTEXT:PLAINTEXT,
        CONTROLLER:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Single-node KRaft quorum (dev).  For prod: list all 3 nodes
      # kafka-1:9093,kafka-2:9093,kafka-3:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093"

      # Broker performance / reliability
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1          # Change to 3 for prod
      KAFKA_MIN_INSYNC_REPLICAS: 1                 # Change to 2 for prod
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_MESSAGE_MAX_BYTES: 10485760            # 10 MB
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600    # 100 MB

      # Retention
      KAFKA_LOG_RETENTION_HOURS: 168               # 7 days
      KAFKA_LOG_RETENTION_BYTES: 10737418240       # 10 GB per partition
      KAFKA_LOG_SEGMENT_BYTES: 1073741824          # 1 GB segment files

      # Producer acks / exactly-once
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      # Log dirs
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # JVM heap (increase for prod)
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"

      # Metrics reporter
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka-1
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka-1:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

