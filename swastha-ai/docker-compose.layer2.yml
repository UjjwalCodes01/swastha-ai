  # kafka-3:
  #   <<: *kafka-common
  #   container_name: swastha-kafka-3
  #   hostname: kafka-3
  #   ports:
  #     - "29094:29092"
  #   environment:
  #     KAFKA_NODE_ID: 3
  #     KAFKA_PROCESS_ROLES: "broker,controller"
  #     KAFKA_CLUSTER_ID: *kafka-cluster-id
