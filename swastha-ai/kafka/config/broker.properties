# broker.properties — Kafka KRaft broker configuration
# This file is mounted into the kafka-1 container as reference documentation.
# The actual configuration is set via environment variables in docker-compose.layer2.yml.
# This file exists for operator reference and for tooling that reads broker.properties directly.

# ── KRaft Mode ────────────────────────────────────────────────────────────────
# No Zookeeper. KRaft is Kafka's built-in consensus protocol from 3.3+.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka-1:9093

# ── Listeners ─────────────────────────────────────────────────────────────────
listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
advertised.listeners=PLAINTEXT://kafka-1:9092,PLAINTEXT_HOST://localhost:29092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER

# ── Storage ───────────────────────────────────────────────────────────────────
log.dirs=/var/lib/kafka/data

# ── Replication (DEV defaults — override for PROD) ────────────────────────────
num.partitions=6
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# ── Performance ───────────────────────────────────────────────────────────────
compression.type=lz4
message.max.bytes=10485760
replica.fetch.max.bytes=10485760
socket.request.max.bytes=104857600

# ── Retention ─────────────────────────────────────────────────────────────────
log.retention.hours=168
log.retention.bytes=10737418240
log.segment.bytes=1073741824

# ── Consumer Groups ───────────────────────────────────────────────────────────
group.initial.rebalance.delay.ms=0
